inherit_mode:
  merge:
    - Include

AllCops:
  TargetRubyVersion: 2.7
  SuggestExtensions: false
  NewCops: enable

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Gemspec/RequireMFA:
  Enabled: false

Gemspec/DevelopmentDependencies:
  EnforcedStyle: gemspec

# The adapters reopen classes/modules on purpose (the monkey-patch
# adapter pattern: a hook file per consumer gem).
Style/OneClassPerFile:
  Exclude:
    - 'lib/tebako-runtime.rb'
    - 'lib/tebako-runtime/adapters/**/*.rb'

Layout/LineLength:
  Max: 120

Naming/FileName:
  Enabled: false
